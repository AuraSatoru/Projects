<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Food Menu</title>
    <style>
        body {
            font-family: Arial;
            background: #fff8f0;
            padding: 30px;
            text-align: center;
        }

        h1 {
            color: #e65c00;
        }

        h1+p {
            background: #ffe0b2;
            padding: 10px 20px;
            border-radius: 8px;
            display: inline-block;
        }

        ul>li {
            list-style: none;
            font-size: 18px;
            font-weight: bold;
            background: #fff3e0;
            padding: 10px 20px;
            margin: 6px auto;
            width: 260px;
        }

        ul li:nth-child(3) {
            background: #ffe082;
            color: #e65c00;
        }

        .desc::first-letter {
            font-size: 220%;
            color: #e65c00;
            font-weight: bold;
        }

        a {
            color: #e65c00;
            border: 2px solid #e65c00;
            border-radius: 8px;
            padding: 8px 18px;
            text-decoration: none;
        }

        a:hover {
            background: #e65c00;
            color: white;
        }
    </style>
</head>

<body>
    <h1>My Food Menu</h1>
    <p>Delicious meals made fresh for you.</p>

    <ul>
        <li>Pizza</li>
        <li>Burger</li>
        <li>Tacos — Chef's Special!</li>
        <li>Noodles</li>
        <li>Ice Cream</li>
    </ul>

    <p class="desc">Enjoy our delicious selection of food, prepared with fresh ingredients.</p>

    <a href="#order">Order Now</a>
    <a href="#more">See More</a>
</body>

</html>
