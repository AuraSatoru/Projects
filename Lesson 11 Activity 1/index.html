<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animal Fact File</title>
    <style>
        body {
            background-color: rgb(137, 253, 137);
            font-family: Arial, sans-serif;
        }

        .titles {
            color: rgb(78, 118, 237);
            text-align: center;
            font-size: 70px;
            font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;

        }

        .fact-file {
            background-color: lightyellow;
            color: darkslategray;
            width: 260px;
            padding: 25px;
            border: 4px solid forestgreen;
            margin: 30px;
        }

        .animal-name {
            color: rgb(247, 68, 68);
            font-size: 22px;
            text-decoration: underline;
        }

        .cool-fact {
            color: rgb(189, 59, 232);
            font-style: italic;
        }
    </style>
</head>

<body>
    <h1 class="titles">My Animal Fact File</h1>
    <div class="divider" style="border-radius: 5px; height: 5px; background-color: #000000; margin: 18px auto;">
    </div>
    <div class="fact-file">
        <h1 class="animal-name">Red Panda</h1>
        <p>Type: Mammal</p>
        <p>Family: Bear</p>
        <p>Red pandas are small, tree-dwelling mammals with reddish fur and long, striped tails.</p>
        <p class="cool-fact">Cool fact: Red pandas use their bushy tails as blankets to keep warm.</p>
    </div>
</body>

</html>
