<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic Function in Js</title>
</head>
<body>
    <button onclick="myFunction(10)">Execute Js Function</button>
    <script>
        function myFunction(x,y) {
            if (y === undefined) {
                y = 3;
            }

            document.write(x * y)
        }
    </script>
</body>
</html>
