<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Methods in Array</title>
</head>
<body>
    <h2>JavaScript Array Methods</h2>
    <h2>Join() and Pop ()</h2>

    <p> a. Join() converts array elements into a single string.<br>
        b. Pop() removes the last element from an array.</p>

    <p id="myjoin"></p>
    <p id="myfirstpop"></p>
    <p id="mysecondpop"></p>

    <script>
        const fruits = ["Apple", "Mango", "Banana", "Orange", "Grapes"];
        document.getElementById("myjoin").innerHTML = fruits.join("*");
        document.getElementById("myfirstpop").innerHTML = fruits.pop();
        document.getElementById("mysecondpop").innerHTML = fruits.pop();
    </script>
</body>
</html>
